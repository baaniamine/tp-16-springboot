
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'tp16'
          environment: 'development'


  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
rule_files:
  - "prometheus-alerts.yml"
